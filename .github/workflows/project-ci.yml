name: OWler project wizard and reload checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/project-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-ow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install packages
        run: npm ci
      - name: Run frontend and project workflow contracts
        run: npm run check
      - name: Stage OW compiler with dependencies.yml support
        run: npm run bundle:ow
      - name: Run real OW starter and dependency integration tests
        run: npm run test:integration
        env:
          OW_JAR: vendor/ow/OwIDE.jar

  rust-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Test project scaffolding and other backend behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml
