name: Owler IDE installers
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    name: Windows NSIS + MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Maven
        run: choco install maven -y --no-progress
      - name: Install web dependencies
        run: npm install
      - name: Test the frontend source contracts
        run: npm test
      - name: Prepare OW compiler, JDK and Zig
        run: npm run bundle:ow
        env:
          OW_BUNDLE_ZIG: '1'
      - name: Test actual OW parser, runtime and Night HTTP server
        run: npm run test:integration
        env:
          OW_JAR: vendor/ow/OwIDE.jar
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Owler IDE Windows installers
        run: npm run tauri build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: Owler-IDE-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Attach installers to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
  mac-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest,ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install packages
        run: npm install
      - name: Test frontend source contracts
        run: npm test
      - name: Stage OW toolchain
        run: npm run bundle:ow
      - name: Test real OW templates and Night HTTP API
        run: npm run test:integration
        env:
          OW_JAR: vendor/ow/OwIDE.jar
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build native bundle
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Owler-IDE-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Attach bundles to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
