[package]
name = "owler-ide"
version = "0.1.0"
description = "Owler IDE - desktop development environment for OW"
authors = ["OW Programming Language"]
edition = "2021"

[lib]
name = "owler_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
regex = "1"
